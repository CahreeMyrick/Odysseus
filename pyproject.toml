[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "odysseus-code-inspector"
version = "0.1.0"
description = "Read-only codebase inspection with source-linked knowledge graphs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Cahree Myrick" }]
dependencies = ["networkx>=3.4,<4", "ollama>=0.6.3,<1", "httpx>=0.27,<1"]

[project.scripts]
odysseus-inspect = "odysseus_agent.__main__:main"
odysseus-demo = "odysseus_agent.benchmarks.prepare:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
research = ["ipython>=9", "jupyter>=1", "matplotlib>=3.9", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/odysseus_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
